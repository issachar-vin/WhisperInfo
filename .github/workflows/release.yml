name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: make release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(make -s version)"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump ## Version in the .toc to publish a new one."
            exit 0
          fi
          gh release create "$TAG" release/*.zip \
            --target "$GITHUB_SHA" \
            --title "Who Are You People? $VERSION" \
            --generate-notes
