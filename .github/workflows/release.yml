name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 (the version WoW runs)
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      # A failing test stops the job here, so nothing is built or released.
      - name: Test
        run: make test LUA=lua5.1 LUAC=luac5.1

      - name: Build zip
        run: make release LUA=lua5.1 LUAC=luac5.1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(make -s version)"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump ## Version in the .toc to publish a new one."
            exit 0
          fi
          gh release create "$TAG" release/*.zip \
            --target "$GITHUB_SHA" \
            --title "Who Are You People? $VERSION" \
            --generate-notes
